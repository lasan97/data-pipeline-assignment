services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: liveklass
      POSTGRES_USER: liveklass
      POSTGRES_PASSWORD: liveklass1111
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveklass -d liveklass"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: liveklass
      DB_USER: liveklass
      DB_PASSWORD: liveklass1111
      EVENT_SESSIONS: "500"
      EVENT_SEED: "1"
      DASHBOARD_PORT: "8050"
    ports:
      - "8050:8050"
